    <script>
      (function() {
        function reloadOnChunkFail(err) {
          var str = (err && (err.message || err.toString())) || '';
          if (str.indexOf('Failed to fetch dynamically imported module') > -1 ||
              str.indexOf('error loading dynamically imported module') > -1 ||
              str.indexOf('Loading chunk') > -1) {
            var key = 'vite_reload_' + window.location.pathname;
            if (!sessionStorage.getItem(key)) {
              sessionStorage.setItem(key, 'true');
              window.location.reload();
            }
          }
        }
        window.addEventListener('error', function(e) { reloadOnChunkFail(e.error || e.message); }, true);
        window.addEventListener('unhandledrejection', function(e) { reloadOnChunkFail(e.reason); });
      })();
    </script>
  </head>
